<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>やまたいもーお助け隊 | 地域の助け合いマッチング</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800;900&display=swap"
    rel="stylesheet">
  <!-- React & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes slideDown {
      0% {
        transform: translateY(-100%);
        opacity: 0
      }

      40% {
        opacity: 1
      }

      100% {
        transform: translateY(0)
      }
    }

    @keyframes stampIn {
      0% {
        transform: scale(3) rotate(-20deg);
        opacity: 0
      }

      60% {
        transform: scale(.9) rotate(2deg);
        opacity: 1
      }

      100% {
        transform: scale(1) rotate(0);
        opacity: 1
      }
    }

    @keyframes popIn {
      0% {
        transform: scale(0);
        opacity: 0
      }

      60% {
        transform: scale(1.15)
      }

      100% {
        transform: scale(1);
        opacity: 1
      }
    }

    @keyframes confetti {
      0% {
        opacity: 1;
        transform: translateY(0) rotate(0)
      }

      100% {
        opacity: 0;
        transform: translateY(80px) rotate(720deg)
      }
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    /* ─────────────────────────────────────────────
       データ定義
       ─────────────────────────────────────────── */

    const DEFAULT_CATEGORIES = [
      { id: "shopping", icon: "🛒", label: "買い物代行", desc: "スーパーや薬局での買い物", status: "active" },
      { id: "cleaning", icon: "🧹", label: "掃除・片付け", desc: "お部屋やお庭の掃除", status: "active" },
      { id: "hospital", icon: "🏥", label: "通院付き添い", desc: "病院への送迎・付き添い", status: "hold" },
      { id: "cooking", icon: "🍳", label: "料理・食事準備", desc: "食事の準備やお弁当作り", status: "active" },
      { id: "tech", icon: "📱", label: "スマホ・IT相談", desc: "スマホ操作やネット手続き", status: "active" },
      { id: "garden", icon: "🌿", label: "庭の手入れ", desc: "草むしりや植木の剪定", status: "active" },
      { id: "pets", icon: "🐕", label: "ペットの世話", desc: "散歩や餌やりのお手伝い", status: "active" },
      { id: "talk", icon: "☕", label: "話し相手・見守り", desc: "おしゃべりや安否確認", status: "active" },
    ];

    const SPREADSHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1bGUwFUi-vlp7IGXSMkLkO0tFg81t5jVa6ID55v8oU1o/edit?gid=0#gid=0";

    const TIME_SLOTS = [
      { id: "anytime", label: "いつでもOK", time: "時間帯を問わない", icon: "🙆" },
      { id: "morning", label: "午前", time: "9:00〜12:00", icon: "🌅" },
      { id: "afternoon", label: "午後", time: "13:00〜17:00", icon: "☀️" },
      { id: "evening", label: "夕方", time: "17:00〜19:00", icon: "🌇" },
    ];

    const AREAS = [
      { id: "naha", label: "那覇エリア", icon: "🏙️" },
      { id: "north", label: "北部エリア", icon: "🌴" },
      { id: "central", label: "中部エリア", icon: "🏘️" },
      { id: "south", label: "南部エリア", icon: "🌺" },
      { id: "island", label: "離島エリア", icon: "🏝️" },
    ];

    const AGE_GROUPS = [
      { id: "20-30", label: "20〜30代", icon: "🙋", desc: "若い力で地域貢献" },
      { id: "40-50", label: "40〜50代", icon: "💪", desc: "経験を活かしてお手伝い" },
      { id: "60plus", label: "60歳以上", icon: "🌟", desc: "人生の知恵で寄り添う" },
    ];

    const MOCK_VOLUNTEERS = [
      { id: 1, name: "田中 さくら", age: 45, rating: 4.8, jobs: 52, avatar: "🧑🦰", skills: ["shopping", "cooking", "talk"] },
      { id: 2, name: "鈴木 太郎", age: 38, rating: 4.9, jobs: 87, avatar: "👨", skills: ["garden", "cleaning"] },
      { id: 3, name: "山田 花子", age: 55, rating: 4.7, jobs: 34, avatar: "👩", skills: ["tech", "shopping", "talk"] },
      { id: 4, name: "佐藤 健一", age: 42, rating: 5.0, jobs: 23, avatar: "🧑", skills: ["pets", "garden", "cleaning"] },
      { id: 5, name: "高橋 美咲", age: 30, rating: 4.6, jobs: 15, avatar: "👩🦱", skills: ["cooking", "tech"] },
    ];

    const F = "'M PLUS Rounded 1c', 'Hiragino Maru Gothic Pro', sans-serif";

    /* ─── Components ─── */

    function Stars({ rating }) {
      return (
        <span style={{ color: "#F59E0B", fontSize: 14, letterSpacing: 1 }}>
          {"★".repeat(Math.floor(rating))}
          {rating % 1 >= 0.5 ? "☆" : ""}
          <span style={{ color: "#94A3B8", fontSize: 12, marginLeft: 4 }}>{rating}</span>
        </span>
      );
    }

    function HoverButton({ children, onClick, disabled, borderColor = "#FED7AA", hoverBorder = "#EA580C", hoverShadow = "rgba(234,88,12,0.15)", selected, selectedBg = "#FFF7ED", selectedBorder = "#EA580C", checkColor = "#EA580C", style: s }) {
      const [h, setH] = useState(false);
      const isActive = selected || false;
      return (
        <button onClick={disabled ? undefined : onClick} onMouseEnter={() => setH(true)} onMouseLeave={() => setH(false)}
          style={{
            background: isActive ? selectedBg : "#fff",
            border: `2px solid ${isActive ? selectedBorder : h && !disabled ? hoverBorder : borderColor}`,
            borderRadius: 16, cursor: disabled ? "default" : "pointer", fontFamily: F, transition: "all 0.2s",
            transform: h && !disabled ? "translateY(-2px)" : "translateY(0)",
            opacity: disabled ? 0.55 : 1,
            boxShadow: isActive ? `0 4px 16px ${hoverShadow}` : h && !disabled ? `0 6px 20px rgba(0,0,0,0.08)` : "0 2px 8px rgba(0,0,0,0.04)",
            position: "relative", outline: "none", ...s,
          }}>
          {children}
          {isActive && (
            <div style={{ position: "absolute", top: 8, right: 8, background: checkColor, color: "#fff", borderRadius: "50%", width: 22, height: 22, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 13, fontWeight: 900 }}>✓</div>
          )}
        </button>
      );
    }

    function BackBtn({ onClick }) {
      return <button onClick={onClick} style={{ background: "none", border: "none", color: "#EA580C", fontSize: 14, cursor: "pointer", fontWeight: 700, padding: 0, marginBottom: 4, fontFamily: F }}>← 戻る</button>;
    }

    function ProgressBar({ current, total, labels, color = "#EA580C" }) {
      return (
        <div style={{ padding: "16px 20px 8px", display: "flex", gap: 6 }}>
          {Array.from({ length: total }).map((_, i) => (
            <div key={i} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 4 }}>
              <div style={{ height: 5, width: "100%", borderRadius: 3, background: i <= current ? `linear-gradient(90deg, ${color}, #F59E0B)` : "#E5E7EB", transition: "background 0.4s" }} />
              <span style={{ fontSize: 9, color: i <= current ? color : "#94A3B8", fontWeight: i === current ? 800 : 400 }}>{labels[i]}</span>
            </div>
          ))}
        </div>
      );
    }

    function PrimaryButton({ children, onClick, disabled, variant = "orange", fullWidth }) {
      const colors = {
        orange: { bg: "linear-gradient(135deg, #EA580C, #D97706)", shadow: "rgba(234,88,12,0.35)" },
        green: { bg: "linear-gradient(135deg, #059669, #10B981)", shadow: "rgba(5,150,105,0.3)" },
        emerald: { bg: "linear-gradient(135deg, #0D9488, #14B8A6)", shadow: "rgba(13,148,136,0.3)" },
        gray: { bg: "linear-gradient(135deg, #64748B, #94A3B8)", shadow: "rgba(100,116,139,0.3)" },
      };
      const c = colors[variant] || colors.orange;
      return (
        <button onClick={onClick} disabled={disabled} style={{
          background: disabled ? "linear-gradient(135deg, #94A3B8, #CBD5E1)" : c.bg,
          color: "#fff", border: "none", borderRadius: 14, padding: "16px 40px", fontSize: 17, fontWeight: 900,
          cursor: disabled ? "not-allowed" : "pointer", fontFamily: F,
          boxShadow: disabled ? "none" : `0 6px 24px ${c.shadow}`, transition: "all 0.2s",
          width: fullWidth ? "100%" : "auto", maxWidth: 360, outline: "none"
        }}
          onMouseEnter={e => { if (!disabled) e.currentTarget.style.transform = "scale(1.03)"; }}
          onMouseLeave={e => e.currentTarget.style.transform = "scale(1)"}
        >{children}</button>
      );
    }

    function FormInput({ label, placeholder, value, onChange, type = "text", example, focusColor = "#0D9488" }) {
      return (
        <div style={{ marginBottom: 16 }}>
          <label style={{ display: "block", fontSize: 13, fontWeight: 700, color: "#1E293B", marginBottom: 6, fontFamily: F }}>{label}</label>
          <input type={type} placeholder={placeholder} value={value} onChange={e => onChange(e.target.value)}
            style={{ width: "100%", padding: "14px 16px", fontSize: 16, border: "2px solid #E5E7EB", borderRadius: 12, fontFamily: F, outline: "none", boxSizing: "border-box", transition: "border-color 0.2s" }}
            onFocus={e => e.target.style.borderColor = focusColor} onBlur={e => e.target.style.borderColor = "#E5E7EB"} />
          {example && <div style={{ fontSize: 11, color: "#94A3B8", marginTop: 4 }}>例）{example}</div>}
        </div>
      );
    }

    function Spinner() {
      return <span style={{ display: "inline-block", width: 18, height: 18, border: "3px solid rgba(255,255,255,0.3)", borderTopColor: "#fff", borderRadius: "50%", animation: "spin 0.8s linear infinite" }} />;
    }

    /* ─── Admin Mode ─── */
    function AdminMode({ categories, setCategories, onBack }) {
      const [newCat, setNewCat] = useState({ id: "", icon: "📦", label: "", desc: "", status: "active" });

      const updateCat = (id, field, value) => {
        setCategories(prev => prev.map(c => c.id === id ? { ...c, [field]: value } : c));
      };

      const addCat = () => {
        if (!newCat.label) return;
        const id = newCat.label.toLowerCase().replace(/\s/g, "_") + "_" + Date.now();
        setCategories(prev => [...prev, { ...newCat, id }]);
        setNewCat({ id: "", icon: "📦", label: "", desc: "", status: "active" });
      };

      const removeCat = (id) => {
        setCategories(prev => prev.filter(c => c.id !== id));
      };

      return (
        <div style={{ padding: "16px 20px 40px" }}>
          <BackBtn onClick={onBack} />
          <h2 style={{ margin: "0 0 4px", fontSize: 20, fontWeight: 900, color: "#1E293B", fontFamily: F }}>🔧 管理者モード</h2>
          <p style={{ fontSize: 13, color: "#64748B", margin: "0 0 16px", fontFamily: F }}>お困りごとカテゴリの追加・編集・保留設定</p>

          <div style={{ background: "#EFF6FF", borderRadius: 12, padding: "14px 16px", marginBottom: 20, border: "1px solid #BFDBFE" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 8 }}>
              <div>
                <div style={{ fontSize: 12, fontWeight: 700, color: "#1E40AF", marginBottom: 4 }}>📊 スプレッドシート連携</div>
                <div style={{ fontSize: 11, color: "#3B82F6", lineHeight: 1.6 }}>
                  Googleスプレッドシートで一括編集が可能です。<br />
                  列構成：id / icon / label / desc / status
                </div>
              </div>
              <a href={SPREADSHEET_CSV_URL} target="_blank" rel="noopener noreferrer"
                style={{
                  background: "#3B82F6", color: "#fff", textDecoration: "none",
                  padding: "8px 12px", borderRadius: 8, fontSize: 11, fontWeight: 800,
                  boxShadow: "0 4px 12px rgba(59,130,246,0.3)", display: "flex", alignItems: "center", gap: 4
                }}>
                📈 編集画面を開く
              </a>
            </div>
            <div style={{ fontSize: 10, color: "#60A5FA", background: "rgba(255,255,255,0.5)", padding: "8px", borderRadius: 8, marginTop: 4 }}>
              ※シートの「status」列に「hold」と入れると一時保留になります。<br />
              ※反映には数秒〜1分ほどかかる場合があります。
            </div>
          </div>

          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {categories.map(c => (
              <div key={c.id} style={{
                background: "#fff", borderRadius: 14, padding: "14px 16px",
                border: `2px solid ${c.status === "hold" ? "#FCA5A5" : "#E5E7EB"}`,
                display: "flex", alignItems: "center", gap: 12,
              }}>
                <span style={{ fontSize: 28 }}>{c.icon}</span>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 15, fontWeight: 800, color: "#1E293B" }}>{c.label}</div>
                  <div style={{ fontSize: 11, color: "#64748B" }}>{c.desc}</div>
                </div>
                <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
                  <button onClick={() => updateCat(c.id, "status", c.status === "active" ? "hold" : "active")}
                    style={{
                      background: c.status === "hold" ? "#FEE2E2" : "#F0FDF4",
                      color: c.status === "hold" ? "#DC2626" : "#059669",
                      border: "none", borderRadius: 8, padding: "6px 10px", fontSize: 11, fontWeight: 700, cursor: "pointer", fontFamily: F,
                    }}>
                    {c.status === "hold" ? "保留中" : "公開中"}
                  </button>
                  <button onClick={() => removeCat(c.id)}
                    style={{ background: "#F1F5F9", border: "none", borderRadius: 8, padding: "6px 8px", cursor: "pointer", fontSize: 14 }}>
                    🗑️
                  </button>
                </div>
              </div>
            ))}
          </div>

          <div style={{ marginTop: 20, background: "#fff", borderRadius: 14, padding: "16px", border: "2px dashed #D1D5DB" }}>
            <div style={{ fontSize: 14, fontWeight: 800, color: "#1E293B", marginBottom: 12, fontFamily: F }}>＋ 新しいカテゴリを追加</div>
            <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
              <input placeholder="絵文字" value={newCat.icon} onChange={e => setNewCat(p => ({ ...p, icon: e.target.value }))}
                style={{ width: 50, padding: "10px", fontSize: 20, border: "2px solid #E5E7EB", borderRadius: 10, textAlign: "center", fontFamily: F, outline: "none", boxSizing: "border-box" }} />
              <input placeholder="カテゴリ名" value={newCat.label} onChange={e => setNewCat(p => ({ ...p, label: e.target.value }))}
                style={{ flex: 1, padding: "10px 14px", fontSize: 15, border: "2px solid #E5E7EB", borderRadius: 10, fontFamily: F, outline: "none", boxSizing: "border-box" }} />
            </div>
            <input placeholder="説明文（例：お庭の草むしりなど）" value={newCat.desc} onChange={e => setNewCat(p => ({ ...p, desc: e.target.value }))}
              style={{ width: "100%", padding: "10px 14px", fontSize: 14, border: "2px solid #E5E7EB", borderRadius: 10, fontFamily: F, outline: "none", marginBottom: 10, boxSizing: "border-box" }} />
            <button onClick={addCat} disabled={!newCat.label}
              style={{
                width: "100%", padding: "12px", background: newCat.label ? "#059669" : "#CBD5E1",
                color: "#fff", border: "none", borderRadius: 10, fontSize: 15, fontWeight: 800, cursor: newCat.label ? "pointer" : "not-allowed", fontFamily: F,
              }}>追加する</button>
          </div>
        </div>
      );
    }

    /* ─── Ticket Stub ─── */
    function TicketStub({ category, customText, price, timeLabels, volunteer, onReset, onTop }) {
      const [printing, setPrinting] = useState(true);
      useEffect(() => { const t = setTimeout(() => setPrinting(false), 1800); return () => clearTimeout(t); }, []);
      const displayLabel = category ? category.label : "自由入力";
      const displayIcon = category ? category.icon : "📝";
      const displayDesc = category ? category.desc : customText;

      return (
        <div style={{ animation: printing ? "slideDown 1.8s ease-out" : "none", display: "flex", flexDirection: "column", alignItems: "center", gap: 24, padding: "40px 20px" }}>
          <div style={{ background: "#FFFBEB", border: "3px dashed #D97706", borderRadius: 16, padding: "32px 28px", maxWidth: 340, width: "100%", position: "relative", boxShadow: "0 8px 32px rgba(217,119,6,0.15)" }}>
            <div style={{ textAlign: "center", borderBottom: "2px dotted #E5E7EB", paddingBottom: 16, marginBottom: 16 }}>
              <div style={{ fontSize: 13, color: "#92400E", fontWeight: 700, letterSpacing: 3, fontFamily: F }}>やまたいもーお助け券</div>
              <div style={{ fontSize: 11, color: "#B45309", marginTop: 4 }}>YAMATAIMOO OTASUKE TICKET</div>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 14 }}>
              <span style={{ fontSize: 36 }}>{displayIcon}</span>
              <div>
                <div style={{ fontSize: 18, fontWeight: 800, color: "#1E293B", fontFamily: F }}>{displayLabel}</div>
                <div style={{ fontSize: 12, color: "#64748B" }}>{displayDesc}</div>
              </div>
            </div>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 14, padding: "10px 0", borderTop: "1px solid #F3E8D0", borderBottom: "1px solid #F3E8D0" }}>
              <div>
                <div style={{ fontSize: 10, color: "#94A3B8", fontWeight: 600 }}>時間帯</div>
                <div style={{ fontSize: 14, fontWeight: 700, color: "#1E293B" }}>{timeLabels}</div>
              </div>
              <div style={{ textAlign: "right" }}>
                <div style={{ fontSize: 10, color: "#94A3B8", fontWeight: 600 }}>ご希望金額</div>
                <div style={{ fontSize: 22, fontWeight: 900, color: "#D97706", fontFamily: F }}>¥{price}</div>
              </div>
            </div>
            {volunteer && (
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <span style={{ fontSize: 32 }}>{volunteer.avatar}</span>
                <div>
                  <div style={{ fontSize: 10, color: "#94A3B8", fontWeight: 600 }}>ボランティアさん</div>
                  <div style={{ fontSize: 15, fontWeight: 700, color: "#1E293B" }}>{volunteer.name}</div>
                  <Stars rating={volunteer.rating} />
                </div>
              </div>
            )}
            <div style={{ position: "absolute", top: 12, right: 12, animation: printing ? "none" : "stampIn 0.5s ease-out 0.3s both", color: "#DC2626", border: "3px solid #DC2626", borderRadius: 8, padding: "4px 10px", fontWeight: 900, fontSize: 13, transform: "rotate(-8deg)", opacity: 0, fontFamily: F }}>受付済</div>
            <div style={{ marginTop: 16, textAlign: "center", fontSize: 10, color: "#B45309", borderTop: "2px dotted #E5E7EB", paddingTop: 12 }}>発行日: {new Date().toLocaleDateString("ja-JP")} ・ No. {Math.floor(Math.random() * 9000 + 1000)}</div>
          </div>
          <div style={{ textAlign: "center", color: "#059669", fontWeight: 700, fontSize: 15, fontFamily: F }}>マッチングが成立しました！</div>
          <div style={{ textAlign: "center", color: "#64748B", fontSize: 13, lineHeight: 1.7, maxWidth: 300 }}>ボランティアさんに通知が送られました。<br />詳細は「マイページ」からご確認ください。</div>
          <PrimaryButton onClick={onReset} variant="green">もう一件依頼する</PrimaryButton>
          <button onClick={onTop} style={{ background: "none", border: "2px solid #D1D5DB", borderRadius: 12, padding: "12px 32px", fontSize: 14, fontWeight: 700, color: "#64748B", cursor: "pointer", fontFamily: F, transition: "all 0.15s", outline: "none" }}
            onMouseEnter={e => e.currentTarget.style.borderColor = "#EA580C"} onMouseLeave={e => e.currentTarget.style.borderColor = "#D1D5DB"}>
            🏠 はじめに戻る
          </button>
        </div>
      );
    }

    /* ─── Request Flow ─── */
    function RequestFlow({ categories, onTop }) {
      const [step, setStep] = useState(0);
      const [cat, setCat] = useState(null);
      const [customText, setCustomText] = useState("");
      const [isCustom, setIsCustom] = useState(false);
      const [price, setPrice] = useState("");
      const [selectedTimes, setSelectedTimes] = useState([]);
      const [vol, setVol] = useState(null);
      const [confirming, setConfirming] = useState(false);
      const [matched, setMatched] = useState(false);

      const activeCategories = categories.filter(c => c.status === "active");
      const holdCategories = categories.filter(c => c.status === "hold");

      const toggleTime = (id) => {
        if (id === "anytime") {
          setSelectedTimes(prev => prev.includes("anytime") ? [] : ["anytime"]);
        } else {
          setSelectedTimes(prev => {
            const next = prev.filter(t => t !== "anytime");
            return next.includes(id) ? next.filter(t => t !== id) : [...next, id];
          });
        }
      };

      const matchedVols = cat
        ? MOCK_VOLUNTEERS.filter(v => v.skills.includes(cat.id))
        : MOCK_VOLUNTEERS.slice(0, 3);

      const handleConfirm = () => { setConfirming(true); setTimeout(() => { setConfirming(false); setMatched(true); setStep(5); }, 1500); };

      const handleReset = () => { setStep(0); setCat(null); setCustomText(""); setIsCustom(false); setPrice(""); setSelectedTimes([]); setVol(null); setMatched(false); };

      const timeLabels = selectedTimes.includes("anytime")
        ? "いつでもOK"
        : selectedTimes.map(t => TIME_SLOTS.find(s => s.id === t)?.label).join("・");

      const titles = ["お困りごとを選ぶ", "ご希望の金額は？", "時間帯を選ぶ", "ボランティアを選ぶ", "内容を確認", ""];
      const pLabels = ["選択", "金額", "時間", "人", "確認"];

      return (
        <div>
          {step < 5 && <ProgressBar current={step} total={5} labels={pLabels} />}
          <div style={{ padding: "8px 20px 4px" }}>
            {step > 0 && step < 5 && <BackBtn onClick={() => setStep(step - 1)} />}

    /* ─── Main App ─── */
    function App() {
      const [mode, setMode] = useState("top");
      const [categories, setCategories] = useState(DEFAULT_CATEGORIES);

      useEffect(() => {
        if (!SPREADSHEET_CSV_URL) return;
        fetch(SPREADSHEET_CSV_URL)
          .then(r => r.text())
          .then(csv => {
            const lines = csv.split("\n").slice(1);
            const parsed = lines.filter(l => l.trim()).map(line => {
              const [id, icon, label, desc, status] = line.split(",").map(s => s.trim().replace(/^"|"$/g, ""));
              return { id, icon, label, desc, status: status || "active" };
            });
            if (parsed.length > 0) setCategories(parsed);
          })
          .catch(err => console.log("CSV読み込み失敗:", err));
      }, []);

      const goTop = () => setMode("top");

      return (
        <div style={{ minHeight: "100vh", background: "linear-gradient(160deg, #FFF7ED 0%, #FEF3C7 40%, #ECFDF5 100%)", fontFamily: F, display: "flex", flexDirection: "column" }}>

          {/* Header */}
          <div style={{ background: "linear-gradient(135deg, #EA580C, #D97706)", color: "#fff", padding: "18px 20px 14px", boxShadow: "0 4px 20px rgba(234,88,12,0.25)", position: "relative", overflow: "hidden" }}>
            <div style={{ position: "absolute", top: -20, right: -20, width: 100, height: 100, borderRadius: "50%", background: "rgba(255,255,255,0.08)" }} />
            <div style={{ display: "flex", alignItems: "center", gap: 10, cursor: mode !== "top" ? "pointer" : "default" }} onClick={goTop}>
              <span style={{ fontSize: 28 }}>🍠</span>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 20, fontWeight: 900, letterSpacing: 1 }}>やまたいもーお助け隊</div>
                <div style={{ fontSize: 10, opacity: 0.85, letterSpacing: 2 }}>地域の助け合いマッチング</div>
              </div>
              {mode === "top" && (
                <button onClick={(e) => { e.stopPropagation(); setMode("admin_login"); }}
                  style={{ background: "rgba(255,255,255,0.15)", border: "1px solid rgba(255,255,255,0.3)", borderRadius: 8, padding: "6px 10px", fontSize: 11, color: "#fff", cursor: "pointer", fontFamily: F, fontWeight: 700, outline: "none" }}>
                  🔧 管理者
                </button>
              )}
            </div>
          </div>

          {/* Main Content */}
          {mode === "top" && (
            <div style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: "40px 20px", gap: 20 }}>
              <div style={{ textAlign: "center", marginBottom: 8 }}>
                <div style={{ fontSize: 48, marginBottom: 8 }}>🍠</div>
                <div style={{ fontSize: 22, fontWeight: 900, color: "#1E293B", lineHeight: 1.5, fontFamily: F }}>あなたはどちらですか？</div>
              </div>
              <button onClick={() => setMode("request")} style={{ background: "#fff", border: "3px solid #FED7AA", borderRadius: 20, padding: "28px 24px", width: "100%", maxWidth: 340, cursor: "pointer", display: "flex", alignItems: "center", gap: 16, fontFamily: F, transition: "all 0.2s", boxShadow: "0 4px 16px rgba(0,0,0,0.05)", outline: "none" }}
                onMouseEnter={e => { e.currentTarget.style.borderColor = "#EA580C"; e.currentTarget.style.transform = "translateY(-3px)"; }}
                onMouseLeave={e => { e.currentTarget.style.borderColor = "#FED7AA"; e.currentTarget.style.transform = "translateY(0)"; }}>
                <span style={{ fontSize: 48 }}>🙋‍♂️</span>
                <div style={{ textAlign: "left" }}>
                  <div style={{ fontSize: 19, fontWeight: 900, color: "#EA580C" }}>助けてほしい</div>
                  <div style={{ fontSize: 13, color: "#64748B", lineHeight: 1.5, marginTop: 4 }}>お困りごとを選んで依頼する</div>
                </div>
              </button>
              <button onClick={() => setMode("register")} style={{ background: "#fff", border: "3px solid #99F6E4", borderRadius: 20, padding: "28px 24px", width: "100%", maxWidth: 340, cursor: "pointer", display: "flex", alignItems: "center", gap: 16, fontFamily: F, transition: "all 0.2s", boxShadow: "0 4px 16px rgba(0,0,0,0.05)", outline: "none" }}
                onMouseEnter={e => { e.currentTarget.style.borderColor = "#0D9488"; e.currentTarget.style.transform = "translateY(-3px)"; }}
                onMouseLeave={e => { e.currentTarget.style.borderColor = "#99F6E4"; e.currentTarget.style.transform = "translateY(0)"; }}>
                <span style={{ fontSize: 48 }}>💪</span>
                <div style={{ textAlign: "left" }}>
                  <div style={{ fontSize: 19, fontWeight: 900, color: "#0D9488" }}>助けたい（登録）</div>
                  <div style={{ fontSize: 13, color: "#64748B", lineHeight: 1.5, marginTop: 4 }}>お助け隊に登録する</div>
                </div>
              </button>
              <div style={{ fontSize: 11, color: "#94A3B8", textAlign: "center", lineHeight: 1.6, marginTop: 8 }}>有償ボランティアで地域を支える仕組みです 🌺</div>
            </div>
          )}

          {mode === "request" && <RequestFlow categories={categories} onTop={goTop} />}
          {mode === "register" && <RegisterFlow categories={categories} onTop={goTop} />}
          {mode === "admin_login" && <AdminLogin onLogin={() => setMode("admin")} onBack={goTop} />}
          {mode === "admin" && <AdminMode categories={categories} setCategories={setCategories} onBack={goTop} />}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
